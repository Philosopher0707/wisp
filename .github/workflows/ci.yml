name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "android/**"
      - "wisp-tui/**"
      - "**.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "android/**"
      - "wisp-tui/**"
      - "**.md"

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install with [dev] extras so httpx/jsonschema/pytest-asyncio/ruff/mypy are present.
          # Without this, collection errors masked real regressions (e.g. undeclared jsonschema).
          pip install -e ".[dev]"

      - name: Run tests (excluding live/network)
        run: pytest -m "not live" --tb=short -p no:cacheprovider

      - name: Ruff (Pyflakes gate)
        run: |
          ruff check wisp/
          # Soft gate: surface tests/ findings without failing the build yet.
          ruff check tests/ --exit-zero

      - name: Mypy on typed spine (hard gate)
        # Strict mypy on the fully-annotated contract seams (events.py,
        # providers/protocol.py, transport/base.py). Hard gate -- these are
        # the seams every consumer depends on. Ratchet target: add
        # stateless.py + multi_agent/task.py once WispConfig attrs are typed.
        run: mypy

      - name: Compile all wisp sources
        run: |
          python -m compileall -q wisp/
          echo "All wisp sources compile OK"

  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
