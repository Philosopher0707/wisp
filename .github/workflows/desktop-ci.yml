name: Desktop CI

on:
  push:
    branches: [main, master]
    paths:
      - 'wisp-desktop/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'wisp-desktop/**'

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisp-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: wisp-desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisp-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: wisp-desktop/package-lock.json

      - run: npm ci
      - run: npm run test

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wisp-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: wisp-desktop/package-lock.json

      - run: npm ci
      - run: npm run build

      # Note: Signing + notarization requires APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD secrets
      # Un-comment after adding them to repo Settings > Secrets > Actions:
      # - run: npm run package
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #     APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
