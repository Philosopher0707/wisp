# The fleet: every repo wisp orchestrates, and the single source of truth for "what exists".
# Roles are a first classification (inferred from each README); correct them freely.
#   orchestrator  exactly one; drives the others          harness   an agent harness / kernel
#   runtime       event or trust runtime                   agent     a task-specific agent
#   tool          a utility or service                    app       a product
#   archive       kept for reference; no remote required
# Check with:  wisp fleet status   |   wisp fleet doctor --strict

[fleet]
scan = ["~/active", "~/workspace", "~/dev"]

[[repo]]
name = "wisp"
path = "~/dev/wisp"
role = "orchestrator"

[[repo]]
name = "archon"
path = "~/active/workspace/archon"
role = "harness"

[[repo]]
name = "tbrr"
path = "~/active/workspace/tbrr"
role = "runtime"

[[repo]]
name = "srr-runtime"
path = "~/active/workspace/srr-runtime"
role = "runtime"

[[repo]]
name = "libraryr"
path = "~/active/workspace/libraryr"
role = "runtime"

[[repo]]
name = "agent-runtime"
path = "~/workspace/general purpose"
role = "runtime"

[[repo]]
name = "plateform"
path = "~/active/plateform"
role = "runtime"

[[repo]]
name = "always-on-worker"
path = "~/active/workspace/always-on-worker"
role = "agent"
# Reached by wisp as an MCP stdio server (docs/adr/2026-10-04-fleet-worker-contract.md).
# The shim has no approve tool: a human grants approvals with the always-on-worker CLI.
# AOW_SPEC currently points at the repo's example spec; replace it with a real one before dispatching jobs.
# No AOW_AUDIT_LOG yet: the audit chain needs a key the human sets up, so decisions are not evidence until then.
[repo.worker]
command = ["/Library/Frameworks/Python.framework/Versions/3.12/bin/python3", "-m", "always_on_worker.mcp_server"]
timeout_seconds = 120
[repo.worker.env]
AOW_SPEC = "~/active/workspace/always-on-worker/examples/worker.json"
AOW_EVENTS = "~/.local/state/wisp-fleet/always-on-worker/events.jsonl"
PYTHONPATH = "~/active/workspace/always-on-worker/src"
[repo.worker.tool_risk]
worker_status = "read"
worker_plan = "read"
worker_events = "read"
worker_approvals = "read"
worker_audit = "read"
worker_run = "exec"

[[repo]]
name = "db-agent"
path = "~/active/workspace/db-agent"
role = "agent"

[[repo]]
name = "gump"
path = "~/active/gump"
role = "agent"
# MCP shim with no `label` tool (the human decision on a fix) and no `run` tool (arbitrary sandbox commands).
# GUMP_ENV_FILE supplies the DSN and model key, so no secret is written into this manifest or mcp.json.
# GUMP_WORKSPACE is unset on purpose: gump_fix needs the human to name the one repo it may work on.
[repo.worker]
command = ["/Library/Frameworks/Python.framework/Versions/3.12/bin/python3", "-m", "gump.mcp_server"]
timeout_seconds = 120
[repo.worker.env]
GUMP_ENV_FILE = "~/active/gump/.env"
PYTHONPATH = "~/active/gump/src"
[repo.worker.tool_risk]
gump_verify = "read"
gump_trajectory = "read"
gump_task = "read"
gump_fix = "exec"

[[repo]]
name = "hank-mas"
path = "~/active/MAS"
role = "agent"

[[repo]]
name = "comp-neuroscientist"
path = "~/active/comp-neuroscientist"
role = "agent"

[[repo]]
name = "data-scientist"
path = "~/active/data-scientist"
role = "agent"

[[repo]]
name = "autopipe"
path = "~/active/autopipe"
role = "archive"

[[repo]]
name = "imgforge"
path = "~/active/tools/imgforge"
role = "tool"

[[repo]]
name = "kiro_research_api"
path = "~/active/kiro_research_api"
role = "tool"

[[repo]]
name = "libretutor"
path = "~/workspace/libretutor"
role = "app"

[[repo]]
name = "cn-d1d3-fix"
path = "~/active/cn-d1d3-fix"
role = "archive"
