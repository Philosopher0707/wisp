[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wisp"
version = "0.1.0"
description = "A local Ollama-powered coding agent — compatible with Warp's Skill ecosystem"
authors = [{ name = "Wisp Contributors" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "textual>=0.61",
    "rich>=13.0",
    "diff-match-patch>=20241021",
    "filelock>=3.0",
    "numpy>=1.24",
    "wcwidth>=0.2.5",
    "jsonschema>=4.0",
    "tree-sitter>=0.21",
    "aiohttp>=3.9",
    "tiktoken>=0.5",
    "prompt_toolkit>=3.0",
    "pydantic>=2.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "pytest-asyncio>=1.3.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
wisp = "wisp.__main__:main"

[tool.setuptools.packages.find]
include = ["wisp*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:coroutine '_run_single_prompt' was never awaited:RuntimeWarning",
]
markers = [
    "live: tests that require network access (excluded from CI by default)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pyflakes only: real bugs (undefined names, unused imports/vars, redefinitions).
# Style rules (E/W) intentionally excluded -- this codebase has intentional
# conditional imports and legacy patterns that would generate noise.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export public APIs by design.
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
# Strict, hard-gated on the contract seams that are fully annotated.
# Ratchet target: wisp/multi_agent/task.py, then the transport layer.
files = ["wisp/core/events.py", "wisp/core/session_view.py", "wisp/core/stateless.py", "wisp/core/runtime.py", "wisp/config.py", "wisp/providers/protocol.py", "wisp/transport/base.py", "wisp/benchmark/scoring.py"]
strict = true
ignore_missing_imports = true
# Don't surface errors from imported untyped modules -- only the spine is gated.
follow_imports = "silent"
