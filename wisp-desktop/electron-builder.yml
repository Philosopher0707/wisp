appId: com.wisp.desktop
productName: Wisp
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
extraResources:
  - from: ../wisp
    to: backend/wisp
    filter:
      - "**/*"
      - "!.venv/**"
      - "!__pycache__/**"
      - "!tests/**"
      - "!.git/**"
      - "!*.egg-info/**"
      - "!graphify-out/**"
      - "!.playwright-mcp/**"
      - "!.pytest_cache/**"
      - "!wisp-desktop/**"
      - "!wisp-tui/**"
      - "!vscode-extension/**"
      - "!android/**"
      - "!docs/**"
      - "!examples/**"
      - "!skills/**"
      - "!workspace/**"
      - "!**/.DS_Store"
      - "!*.md"
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: Wisp-${version}-mac.${ext}
  darkModeSupport: true

# Auto-updates via GitHub Releases
# electron-updater will poll ${repo}/releases/latest/latest-mac.yml
publish:
  provider: github
  owner: Philosopher0707
  repo: wisp
  releaseType: release
